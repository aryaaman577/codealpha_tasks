{% extends 'base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header" style="text-align:center;"><h1>Contact <span class="gold">Us</span></h1><p>We'd love to hear from you</p></div>
    <div class="contact-layout">
        <div>
            <div class="contact-card"><div class="contact-icon"><i class="fas fa-envelope"></i></div><div><h4>Email</h4><p style="color:var(--text-muted);font-size:0.9rem;">contact@aryacart.com</p></div></div>
            <div class="contact-card"><div class="contact-icon"><i class="fas fa-phone"></i></div><div><h4>Phone</h4><p style="color:var(--text-muted);font-size:0.9rem;">+91 9936281054</p></div></div>
            <div class="contact-card"><div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div><div><h4>Location</h4><p style="color:var(--text-muted);font-size:0.9rem;">India</p></div></div>
            <div class="contact-card"><div class="contact-icon"><i class="fas fa-clock"></i></div><div><h4>Working Hours</h4><p style="color:var(--text-muted);font-size:0.9rem;">Mon-Fri, 9AM-6PM IST</p></div></div>
        </div>
        <div class="detail-card">
            <h3 style="margin-bottom:1.5rem;">Send a Message</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group"><label>Name</label><input type="text" name="name" class="form-input" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" class="form-input" required></div>
                <div class="form-group"><label>Subject</label><input type="text" name="subject" class="form-input" required></div>
                <div class="form-group"><label>Message</label><textarea name="message" class="form-input" rows="5" required></textarea></div>
                <button type="submit" class="btn-gold btn-lg btn-block btn-ripple"><i class="fas fa-paper-plane"></i> Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
