{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;">
    <div class="page-header"><h1>Edit Profile</h1></div>
    <div class="detail-card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group"><label>Avatar</label><input type="file" name="avatar" class="form-input" accept="image/*">{% if user.profile.avatar %}<div style="margin-top:8px;"><img src="{{ user.profile.avatar.url }}" alt="Avatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);"></div>{% endif %}</div>
            <div class="form-row">
                <div class="form-group"><label>First Name</label><input type="text" name="first_name" class="form-input" value="{{ form.first_name.value|default:'' }}"></div>
                <div class="form-group"><label>Last Name</label><input type="text" name="last_name" class="form-input" value="{{ form.last_name.value|default:'' }}"></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" name="email" class="form-input" value="{{ form.email.value|default:'' }}"></div>
            <div class="form-group"><label>Phone</label><input type="text" name="phone" class="form-input" value="{{ form.phone.value|default:'' }}"></div>
            <div class="form-group"><label>City</label><input type="text" name="city" class="form-input" value="{{ form.city.value|default:'' }}"></div>
            <div class="form-group"><label>Address</label><textarea name="address" class="form-input" rows="3">{{ form.address.value|default:'' }}</textarea></div>
            <div class="form-group"><label>Bio</label><textarea name="bio" class="form-input" rows="3">{{ form.bio.value|default:'' }}</textarea></div>
            <button type="submit" class="btn-gold btn-lg btn-ripple">Save Changes</button>
            <a href="{% url 'accounts:profile' %}" class="btn-outline" style="margin-left:1rem;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
