{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome <span class="gold">Back</span></h2>
        <p class="auth-subtitle">Sign in to your AryaCart account</p>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>Username</label><input type="text" name="username" class="form-input" required autofocus></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" class="form-input" required></div>
            <button type="submit" class="btn-gold btn-lg btn-block btn-ripple" style="margin-top:0.5rem;">Sign In</button>
        </form>
        <div class="auth-footer">Don't have an account? <a href="{% url 'accounts:register' %}">Create one</a></div>
    </div>
</div>
{% endblock %}
