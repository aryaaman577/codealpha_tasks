services:
  - type: web
    name: aryacart
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn novacart.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: aryacart-db
          property: connectionString

databases:
  - name: aryacart-db
    plan: free
    databaseName: aryacart_db
